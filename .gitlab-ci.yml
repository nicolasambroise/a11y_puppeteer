stages:
- a11y_tests

puppeteer:
  stage: a11y_tests
  image: ghcr.io/puppeteer/puppeteer:latest

  allow_failure: true

  script:
  - npm ci
  - npm run test:puppeteer
  - REPORT=$(ls -t reports/report-*.json | head -1)
  - echo "Report found: $REPORT"

  artifacts:
    name: "puppeteer-report-$CI_PIPELINE_ID"
    when: always
    expire_in: 10 days
    paths:
    - reports/