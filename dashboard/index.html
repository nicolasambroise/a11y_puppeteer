<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Audit A11Y Renowify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 2rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      h2 {
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      h3 {
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .grid {
        display: grid;
        gap: 1.5rem;
      }

      @media (min-width: 900px) {
        .grid-3 {
          grid-template-columns: repeat(3, 1fr);
        }
        .grid-2 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .card {
        background: white;
        padding: 0.5rem 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      .criticity-box {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.2rem;
      }

      .yellow {
        color: #ffc107;
      }
      .orange {
        color: #ff9800;
      }
      .red {
        color: #f44336;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      table th,
      table td {
        padding: 0.5rem;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      .trend-up {
        color: #f44336;
        font-weight: bold;
      }
      .trend-down {
        color: #4caf50;
        font-weight: bold;
      }
      .trend-equal {
        color: #999;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Dashboard Audit A11Y Renowify</h1>
    <div id="latest"></div>
    <div id="summary" class="grid grid-2"></div>

    <h2>Évolution historique</h2>
    <div class="card">
      <canvas id="chartEvolution" height="100"></canvas>
    </div>

    <h2>Top pages par criticité</h2>
    <div id="topPages" class="grid grid-2"></div>

    <h2>Problèmes les plus fréquents par criticité</h2>
    <div id="topProblemsContainer" class="grid grid-2"></div>

    <h2>Update DB</h2>
    <div id="updateDB" class="grid grid-2"></div>

    <!--script src="./dashboard.js"></script-->
    <script>
      async function loadReports() {
        const response = await fetch("../reports/index.json");
        if (!response.ok)
          throw new Error(
            `Impossible de lire l’index des rapports (${response.status})`,
          );
        const files = await response.json();
        const reports = await Promise.all(
          files.map(async (file) => {
            const reportResponse = await fetch(
              "../reports/" + encodeURIComponent(file),
            );
            if (!reportResponse.ok)
              throw new Error(`Impossible de lire le rapport ${file}`);
            return { file, ...(await reportResponse.json()) };
          }),
        );
        return reports.sort((a, b) =>
          a.generatedAt.localeCompare(b.generatedAt),
        );
      }
      function uniq(a) {
        return Array.from(new Set(a));
      }

      function renderLatestDate(latest) {
        //console.log(latest);
        const container = document.getElementById("latest");
        container.innerHTML = `<p>Dernier run : <em>${escapeHtml(latest.generatedAt)}</em> sur ${latest.totalPages} pages (Version : ${escapeHtml(latest.pluginVersion)})</p>`;
      }

      function trendColor(diff) {
        if (diff > 0) return `<span class="trend-up">↑ (+${diff})</span>`;
        if (diff < 0) return `<span class="trend-down">↓ (${diff})</span>`;
        return `<span class="trend-equal">= (0)</span>`;
      }

      function renderSummary(latest, previous) {
        const container = document.getElementById("summary");

        const lt2 = latest.totals[2];
        const lt3 = latest.totals[3];
        const pt2 = previous.totals[2];
        const pt3 = previous.totals[3];
        const diff_t2 = previous.generatedAt ? lt2 - pt2 : 0;
        const diff_t3 = previous.generatedAt ? lt3 - pt3 : 0;

        container.innerHTML = `
    <div class="card">
      <h3 class="criticity-box orange">🟠 Alertes</h3>
      <ul>
		  <li>Total : <strong>${lt2}</strong></li>
		  <li>Tendance : ${trendColor(diff_t2)}</li>
		  <li>Occurrences pour 100 pages : <strong>${(Math.round((lt2 / latest.totalPages) * 100000) / 1000).toFixed(3)}</strong></li>
	  </ul>
    </div>

    <div class="card">
      <h3 class="criticity-box red">🔴 Erreurs</h3>
	  <ul>
		<li>Total : <strong>${lt3}</strong></li>
        <li>Tendance : ${trendColor(diff_t3)}</li>
	    <li>Occurrences pour 100 pages : <strong>${(Math.round((lt3 / latest.totalPages) * 100000) / 1000).toFixed(3)}</strong></li>
    </div>
  `;
      }

      function renderTopPages(latest, previous) {
        const container = document.getElementById("topPages");

        function tableFor(
          list_latest,
          list_previous,
          criticityLevel,
          colorClass,
          picto,
          title,
        ) {
          return `
      <div class="card">
        <h3 class="criticity-box ${colorClass}">${picto} ${title}</h3>
        <table>
          <tr>
            <th>Page</th>
            <th>Nb</th>
            <th>Tendance</th>
          </tr>
          ${list_latest
            .slice(0, 10)
            .map((p) => {
              const prev = list_previous.find((x) => x.id === p.id);
              const diff = prev ? p.count - prev.count : 0;
              return `
			<tr>
              <td>${escapeHtml(p.title)}<br><small>${escapeHtml(p.url)}</small></td>
              <td><strong>${p.count}</strong></td>
              <td>${trendColor(diff)}</td>
            </tr>
          `;
            })
            .join("")}
        </table>
      </div>
    `;
        }

        const lc2 = latest.topPages.criticity2;
        const lc3 = latest.topPages.criticity3;
        const pc2 = previous.topPages.criticity2;
        const pc3 = previous.topPages.criticity3;

        container.innerHTML = `
    ${tableFor(lc2, pc2, 2, "orange", "🟠", "Alertes")}
    ${tableFor(lc3, pc3, 3, "red", "🔴", "Erreurs")}
  `;
      }

      function renderTopProblems(latest, previous) {
        const container = document.getElementById("topProblemsContainer");
        console.log(previous);
        console.log(latest);
        function tableFor(
          list_latest,
          list_previous,
          criticityLevel,
          colorClass,
          picto,
          title,
        ) {
          return `
      <div class="card">
        <h3 class="criticity-box ${colorClass}">${picto} ${title}</h3>
        <table>
          <tr>
            <th>Code</th>
            <th>Message</th>
            <th>Nb</th>
            <th>Pour 100 pages</th>
            <th>Tendance</th>
          </tr>
          ${list_latest
            .slice(0, 10)
            .map((p) => {
              const prev = list_previous.find(
                (x) => x.code === p.code && x.message === p.message,
              );
              const diff = prev ? p.count - prev.count : 0;
              const codeCleaned = p.code
                .replace("Color orange", "")
                .replace("Color red", "")
                .trim();
              return `
              <tr>
                <td>${codeCleaned}</td>
                <td>${escapeHtml(p.message)}</td>
                <td><strong>${p.count}</strong></td>
                <td>${Math.round((p.count * 100) / latest.totalPages)}%</td>
                <td>${trendColor(diff)}</td>
              </tr>
            `;
            })
            .join("")}
        </table>
      </div>
    `;
        }

        const lc2 = latest.topProblems.filter((p) => p.criticity === 2);
        const lc3 = latest.topProblems.filter((p) => p.criticity === 3);
        const pc2 = previous.topProblems.filter((p) => p.criticity === 2);
        const pc3 = previous.topProblems.filter((p) => p.criticity === 3);

        container.innerHTML = `
    ${tableFor(lc2, pc2, 2, "orange", "🟠", "Alertes")}
    ${tableFor(lc3, pc3, 3, "red", "🔴", "Erreurs")}
  `;
      }

      function renderEvolution(reports) {
        const labels = reports.map((r) => r.generatedAt);
        const c2AllPagesNb = reports.map((r) => r.totals[2]);
        const c2 = reports.map((r) =>
          (Math.round((r.totals[2] / r.totalPages) * 100000) / 1000).toFixed(3),
        );
        const c3AllPagesNb = reports.map((r) => r.totals[3]);
        const c3 = reports.map((r) =>
          (Math.round((r.totals[3] / r.totalPages) * 100000) / 1000).toFixed(3),
        );
        const version = reports.map((r) => r.pluginVersion);
        const totalPages = reports.map((r) => r.totalPages);
        console.log(version);

        const tooltipSum = (tooltipItems) => {
          let sum = 0;
          tooltipItems.forEach(function (tooltipItem) {
            sum += tooltipItem.parsed.y;
          });
          return (
            "Sum ratio: " + (Math.round(sum * 1000) / 1000).toFixed(3) + " %"
          );
        };

        const tooltipVersion = (tooltipItems) => {
          const dataIndex = tooltipItems[0]["dataIndex"];
          const currentVersion = version[dataIndex];
          return "Version: " + currentVersion;
        };

        const tooltipPages = (tooltipItems) => {
          const dataIndex = tooltipItems[0]["dataIndex"];
          const c2pagesNb = c2AllPagesNb[dataIndex];
          const c3pagesNb = c3AllPagesNb[dataIndex];
          const totalPagesNb = totalPages[dataIndex];
          return (
            "Erreurs: " +
            c3pagesNb +
            " | Alertes: " +
            c2pagesNb +
            " | Pages:" +
            totalPagesNb
          );
        };

        new Chart(document.getElementById("chartEvolution"), {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Alertes pour 100 pages",
                data: c2,
                borderColor: "#FF9800",
                pointStyle: "circle",
                backgroundColor: "#FF980066",
                tension: 0.2,
              },
              {
                label: "Erreurs pour 100 pages",
                data: c3,
                borderColor: "#F44336",
                pointStyle: "triangle",
                backgroundColor: "#F4433666",
                tension: 0.2,
              },
            ],
          },
          options: {
            interaction: {
              intersect: false,
              mode: "index",
            },
            plugins: {
              tooltip: {
                callbacks: {
                  beforeFooter: tooltipSum,
                  footer: tooltipPages,
                  afterFooter: tooltipVersion,
                },
              },
            },
          },
        });
      }

      function cleanQuote(item) {
        return item ? item.replaceAll("'", "’") : "";
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }

      function renderUpdateDB(latest) {
        console.log(latest);
        const container = document.getElementById("updateDB");

        const newTitle = latest.results.filter(
          (el) =>
            !el.error &&
            el.originalTitle !== cleanQuote(el.title) &&
            cleanQuote(el.title).indexOf("404") < 0,
        );
        const newLang = latest.results.filter(
          (el) => !el.error && el.lang && el.iso != el.lang,
        );
        const newStatus = latest.results.filter(
          (el) => !el.error && el.status != 200,
        );

        let query = "";
        let msg = "";

        newTitle.forEach(function (item) {
          msg += `<li>TITLE : [${item.id}] ${item.originalTitle} => ${cleanQuote(item.title)}</li>`;
          query += `<li>UPDATE page SET title = '${cleanQuote(item.title)}' WHERE id=${item.id};</li>`;
        });

        newLang.forEach(function (item) {
          msg += `<li>LANG : [${item.id}] ${item.iso} => ${item.lang}</li>`;
          query += `<li>UPDATE page SET iso = '${item.iso}' WHERE id=${item.id};</li>`;
        });

        newStatus.forEach(function (item) {
          msg += `<li>STATUS : [${item.id}] '200' => ${item.status}</li>`;
          query += `<li>UPDATE page SET status = ${item.status} WHERE id=${item.id};</li>`;
        });

        container.innerHTML = `<div class="card"><ul>${msg}</ul></div><div class="card"><ul>${query}</ul></div>`;
      }

      (async () => {
        const reports = await loadReports();
        const latest = reports[reports.length - 1];
        const previous = reports[reports.length - 2] || {
          totals: { 2: 0, 3: 0 },
          topPages: { criticity2: [], criticity3: [] },
          topProblems: [],
        };
        if (!latest) {
          document.getElementById("latest").textContent =
            "Aucun rapport disponible.";
          return;
        }
        renderLatestDate(latest);
        renderSummary(latest, previous);
        renderTopPages(latest, previous);
        renderTopProblems(latest, previous);
        renderEvolution(reports);
        renderUpdateDB(latest);
      })();
    </script>
  </body>
</html>
